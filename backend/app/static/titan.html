    * { box-sizing: border-box; }
    html, body {
      margin: 0;

      color: #f8fafc;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .jpl-panel {
      background: rgba(11, 13, 19, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 158, 11, 0.28);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.72), inset 0 0 20px rgba(245, 158, 11, 0.04);
    }

    .jpl-cyan {
      background: rgba(9, 15, 24, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.72), inset 0 0 20px rgba(56, 189, 248, 0.05);

    /* Custom Range Slider for Pre-Launch Trade-Off */
    input[type="range"].jpl-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8 0%, #f59e0b 100%);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].jpl-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.8);
      cursor: pointer;
    }

    /* Crash Screen Shake */
    @keyframes crash-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-7px, 5px) rotate(-0.8deg); }
      30% { transform: translate(7px, -4px) rotate(0.8deg); }
      45% { transform: translate(-5px, -5px) rotate(-0.5deg); }
      60% { transform: translate(6px, 4px) rotate(0.6deg); }
      75% { transform: translate(-4px, 3px) rotate(-0.4deg); }
    }
    .shaking {
      animation: crash-shake 0.16s infinite;
    }

    .thin-scroll::-webkit-scrollbar { width: 4px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.4); border-radius: 999px; }

      'use strict';

      // =======================================================================
      // 1. WEB AUDIO API SYNTHESIZER (Atmospheric Titan Wind, Footsteps, HUD)
      // =======================================================================
      const AudioFX = {
        ctx: null,
        muted: false,
        windStarted: false,
        windGain: null,

        ensure() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          if (this.ctx && !this.windStarted) {
            this.startAmbientTitanWind();
          }
          return this.ctx;
        },

        startAmbientTitanWind() {
          try {
            if (!this.ctx || this.windStarted) return;
            this.windStarted = true;
            const len = this.ctx.sampleRate * 2;
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            let last = 0;
            for (let i = 0; i < len; i++) {
              const w = Math.random() * 2 - 1;
              data[i] = (last + 0.025 * w) / 1.025;
              last = data[i];
              data[i] *= 1.6;
            }
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            src.loop = true;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 165;

            const gain = this.ctx.createGain();
            gain.gain.value = this.muted ? 0 : 0.045;
            this.windGain = gain;

            src.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
          } catch (e) {}
        },

        toggleMute() {
          this.muted = !this.muted;
          if (!this.muted) this.ensure();
          if (this.windGain && this.ctx) {
            this.windGain.gain.setTargetAtTime(this.muted ? 0 : 0.045, this.ctx.currentTime, 0.08);
          }
          return !this.muted;
        },

        beep(freq, type = 'sine', dur = 0.08, vol = 0.06, endFreq = null) {
          try {
            const ctx = this.ensure();
            if (!ctx || this.muted) return;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + dur);
            g.gain.setValueAtTime(vol, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + dur);
          } catch (e) {}
        },

        click() { this.beep(620, 'triangle', 0.07, 0.055, 880); },
        radarPing() { this.beep(1080, 'sine', 0.16, 0.045, 740); },
        alert() {

      // =======================================================================

      // =======================================================================
      function getPreLaunchPreview() {
        const t = state.hullAlloc / 100; // 0 (Light Ship / Rich Supplies) -> 1 (Heavy Ship / Tight Supplies)
        const startHull = Math.round(28 + t * 50); // 28% to 78%
        let startO2 = Math.round(98 - t * 44);    // 98% to 54%
        let startPower = state.extraRTG ? 110 : 75;
        if (!state.extraRTG) startO2 = Math.min(100, startO2 + 12);
        const startDataCap = state.role === 'scientist' ? 300 : 250;
        const hullCostB = (0.7 + t * 1.6).toFixed(2);
        const supplyCostB = (3.0 - parseFloat(hullCostB)).toFixed(2);
        return { startHull, startO2, startPower, startDataCap, hullCostB, supplyCostB };

      // =======================================================================
      // 5. SOCRATIC AI ADVISOR ("HERMES-9" — NEVER GIVES DIRECT ANSWERS)

      function askHermes(promptText) {
        AudioFX.radarPing();
        const q = promptText.trim();
        if (!q) return;

        state.advisorMessages.push({ sender: 'CDR', text: q });
        const lower = q.toLowerCase();

        const hullGap = Math.max(0, 100 - state.hull);
        const o2 = Math.round(state.o2);
        const pwr = Math.round(state.power);
        const sci = Math.round(state.scienceScore);
        const therm = Math.round(state.thermalCore);
        const nearSite = LANDMARKS.find(l => l.id === state.activeLandmarkId);

        let reply = '';

        if (lower.includes('heat') || lower.includes('temp') || lower.includes('cold') || lower.includes('freeze') || lower.includes('chill')) {
          reply = `Suit thermal core is at ${therm}%. Ambient Titan atmosphere is -179°C (94 K). If core drops below 35%, metabolic shivering accelerates O₂ consumption by 80%. Press [1] to trigger a chemical Cryo-Thermal Heat Pack (${state.inventory.heatPacks} remaining) or return to Site-01 lander shelter.`;
        } else if (lower.includes('drill') || lower.includes('sample') || lower.includes('canister')) {
          reply = `Astrobiology Drill has ${state.inventory.drillUsesLeft} charges left (${state.inventory.samples.length}/4 sample canisters sealed). Coring into Kraken Mare shoreline or the Cryovolcanic Vent extracts pristine methane-tholin and prebiotic slurry. Coring elsewhere yields negligible scientific data.`;
        } else if (lower.includes('item') || lower.includes('inventory') || lower.includes('pack') || lower.includes('tool')) {
          reply = `Toolbelt stores: ${state.inventory.heatPacks}x Cryo-Heat Packs [1], ${state.inventory.batteryCells}x Li-S Cells [2], ${state.inventory.naniteSealant}x Nanite Seals [3], and ${state.inventory.drillUsesLeft}x Cryo-Drill charges [4]. Deploying resources early reduces systemic failure probability.`;
        } else if (lower.includes('which') || lower.includes('right') || lower.includes('best') || lower.includes('tell me what')) {
          reply = `Command protocol prohibits directive selection. Current telemetry shows Hull at ${state.hull}% (${hullGap}% below nominal) and EVA O₂ at ${o2}%. Aggressive sampling yields higher planetary science, whereas conservative scans preserve life-support margin for structural repairs. Weigh which failure mode you are willing to accept.`;
        } else if (lower.includes('hull') || lower.includes('o2') || lower.includes('oxygen') || lower.includes('risk')) {
          reply = `Structural deficit is ${hullGap}% with ${o2}% O₂ and ${pwr} kWh remaining. High-output hull sealing accelerates ascent readiness but depletes power or spectrometer efficiency; deep cryogenic sampling at Kraken Mare or the Cryo-Vent consumes 16–24% O₂ per run. Assess whether your remaining O₂ buffer covers both exploration and final hull closure.`;
        } else if (lower.includes('comms') || lower.includes('lake') || lower.includes('vent') || lower.includes('priorit')) {
          reply = `Comms Relay is currently ${state.comms} (${state.dataUsed}/${state.dataMax} GB buffered). Restoring Ka-band uplink converts buffered data into confirmed Earth science and opens DSN telemetry, whereas Kraken Mare and the Cryo-Vent offer higher raw discovery yield at steeper thermal and O₂ cost.`;
        } else if (lower.includes('ascent') || lower.includes('launch') || lower.includes('ready') || lower.includes('leave')) {
          if (state.hull >= 100) {
            reply = `Aeroshell integrity is at 100%—nominal for orbital insertion. Remaining O₂ (${o2}%) can either be held as ascent margin or expended on one final local scan before boarding Site-01.`;
          } else if (state.hull >= 80) {
            reply = `Hull is at ${state.hull}%: above the 80% emergency abort threshold, though sub-nominal aerodynamic heating carries structural risk during Titan atmospheric exit. Reaching 100% eliminates launch failure probability.`;
          } else {
            reply = `Hull is at ${state.hull}%—below the 80% minimum structural threshold for ascent ignition. Additional repairs at Site-01 (or capacitor harvesting) are mandatory before liftoff.`;
          }
        } else if (nearSite) {
          reply = `Proximity telemetry at ${nearSite.name}: ${nearSite.tag}. High-intensity actions here yield superior mission return at elevated O₂/thermal draw; low-intensity options preserve survivability margin. Current reserves: ${o2}% O₂, ${pwr} kWh, ${sci} Science.`;
        } else {
          reply = `Live status: Hull ${state.hull}%, O₂ ${o2}%, Suit Temp ${therm}%, Power ${pwr} kWh, Comms ${state.comms}, Science ${sci}. Every kilometer traversed drains O₂; balance site proximity against remaining repair requirements at Site-01.`;
        }

        state.advisorMessages.push({ sender: 'HERMES-9', text: reply });
        if (state.advisorMessages.length > 8) {
          state.advisorMessages = state.advisorMessages.slice(-8);
        }
        renderHUD();
      }

      // =======================================================================
      // 5B. EVA INVENTORY & TOOLBELT FIELD ACTIONS
      // =======================================================================
      function useInventoryItem(itemType) {
        if (state.phase !== 'surface') return;
        AudioFX.ensure();

        if (itemType === 'heatPack') {
          if (state.inventory.heatPacks <= 0) {
            AudioFX.alert();
            state.missionLogs.unshift('[TOOLBELT] No Cryo-Heat Packs remaining in PLSS carrier.');
            renderHUD();
            return;
          }
          state.inventory.heatPacks -= 1;
          state.heatPackTimer = 60.0;
          state.thermalCore = 100;
          AudioFX.beep(480, 'sine', 0.25, 0.08, 920);
          state.missionLogs.unshift('[TOOLBELT] Activated Cryo-Thermal chemical pack. Internal suit heating online (60s).');
          state.advisorMessages.push({
            sender: 'HERMES-9',
            text: 'Suit thermal core stabilized at 100%. Shivering metabolic O₂ consumption rate neutralized for 60 seconds.'
          });
        } else if (itemType === 'battery') {
          if (state.inventory.batteryCells <= 0) {
            AudioFX.alert();
            state.missionLogs.unshift('[TOOLBELT] No auxiliary Li-S cells remaining.');
            renderHUD();
            return;
          }
          state.inventory.batteryCells -= 1;
          state.power = Math.min(state.maxPower, state.power + 28);
          AudioFX.beep(650, 'triangle', 0.18, 0.08, 880);
          state.missionLogs.unshift('[TOOLBELT] Discharged Li-S auxiliary battery cell (+28 kWh power bus boost).');
          state.advisorMessages.push({
            sender: 'HERMES-9',
            text: `Auxiliary battery discharge verified. Power bus now at ${Math.round(state.power)}/${state.maxPower} kWh.`
          });
        } else if (itemType === 'nanites') {
          if (state.inventory.naniteSealant <= 0) {
            AudioFX.alert();
            state.missionLogs.unshift('[TOOLBELT] No Beryllium nanite sealant canisters remaining.');
            renderHUD();
            return;
          }
          state.inventory.naniteSealant -= 1;
          const repairBoost = Math.round(18 * ROLES[state.role].repairMult);
          state.hull = Math.min(100, state.hull + repairBoost);
          AudioFX.beep(520, 'sawtooth', 0.2, 0.07, 780);
          state.missionLogs.unshift(`[TOOLBELT] Deployed Beryllium nanite aerosol (+${repairBoost}% Hull integrity).`);
          state.advisorMessages.push({
            sender: 'HERMES-9',
            text: `Micro-fractures sealed by catalytic nanites. Hull integrity reached ${state.hull}%.`
          });
        } else if (itemType === 'drill') {
          if (state.inventory.drillUsesLeft <= 0) {
            AudioFX.alert();
            state.missionLogs.unshift('[TOOLBELT] Astrobiology core drill tungsten bit fully worn.');
            renderHUD();
            return;
          }
          const nearSite = LANDMARKS.find(l => l.id === state.activeLandmarkId);
          if (!nearSite || (nearSite.id !== 'lake' && nearSite.id !== 'vent')) {
            AudioFX.alert();
            state.missionLogs.unshift('[TOOLBELT HAZARD] Core drill requires volatile substrate. Stand near Kraken Mare (Site-03) or Cryo-Vent (Site-04).');
            state.advisorMessages.push({
              sender: 'HERMES-9',
              text: 'Surface ice here is desiccated regolith. Move within 30m of the shoreline or cryovolcanic vent to extract live prebiotic samples.'
            });
            renderHUD();
            return;
          }

          state.inventory.drillUsesLeft -= 1;
          AudioFX.beep(160, 'sawtooth', 0.45, 0.09, 280);
          
          if (nearSite.id === 'lake') {
            const sampleName = 'Kraken Mare Liquid Nitrile Sludge';
            if (!state.inventory.samples.includes(sampleName)) state.inventory.samples.push(sampleName);
            const sciGain = Math.round(120 * state.scienceMultRuntime);
            state.scienceScore += sciGain;
            state.dataUsed = Math.min(state.dataMax, state.dataUsed + 45);
            state.missionLogs.unshift(`[CORE DRILL] Extracted 10cm benthic sludge cylinder (+${sciGain} Science, +45 GB). Canister sealed.`);
            state.advisorMessages.push({
              sender: 'HERMES-9',
              text: 'Liquid hydrocarbon sludge sample analyzed: complex nitrogen heterocycles identified! Data added to science buffer.'
            });
          } else if (nearSite.id === 'vent') {
            const sampleName = 'Ammonia-Water Cryomagma Slurry';
            if (!state.inventory.samples.includes(sampleName)) state.inventory.samples.push(sampleName);
            const sciGain = Math.round(145 * state.scienceMultRuntime);
            state.scienceScore += sciGain;
            state.dataUsed = Math.min(state.dataMax, state.dataUsed + 55);
            state.missionLogs.unshift(`[CORE DRILL] Extracted warm cryomagma core (+${sciGain} Science, +55 GB). Canister sealed.`);
            state.advisorMessages.push({
              sender: 'HERMES-9',
              text: 'Subsurface ammonia-water core shows catalytic acetylene depletion! Prime biomarker candidate logged.'
            });
          }
        }

        renderHUD();
      }

      // =======================================================================
      // 6. LAUNCH -> CRASH -> SURFACE TRANSITIONS
      // =======================================================================
      function startMissionFromBriefing() {
        AudioFX.click();
        const prev = getPreLaunchPreview();
        state.hull = prev.startHull;
        state.o2 = prev.startO2;
        state.power = prev.startPower;
        state.maxPower = prev.startPower;
        state.dataUsed = 0;
        state.dataMax = prev.startDataCap;
        state.scienceScore = 0;
        state.scienceMultRuntime = ROLES[state.role].scienceMult;
        state.comms = 'OFFLINE';
        state.siteStage = { lander: 0, comms: 0, lake: 0, vent: 0 };
        state.missionLogs = [];
        state.inventory = { heatPacks: 3, batteryCells: 2, naniteSealant: 2, drillUsesLeft: 3, samples: [] };
        state.thermalCore = 100;
        state.heatPackTimer = 0;
        state.claimedReward = null;
        state.player = { x: 590, y: 675, targetX: null, targetY: null, facing: 0.4, walkCycle: 0, stepTimer: 0 };
        state.cam = { x: 590, y: 675 };
        state.openDilemmaSiteId = null;
        state.debriefOutcome = null;

        state.phase = 'crash';
        AudioFX.crashImpact();
        render();

        setTimeout(() => {
          state.phase = 'surface';
          initSurfaceParticles();
          render();
          startSurfaceLoop();
        }, 2800);
      }

      function initSurfaceParticles() {
        particles = Array.from({ length: 70 }, () => ({
          x: Math.random() * 1800,
          y: Math.random() * 1150,
          r: Math.random() * 2.2 + 0.6,
          vx: 14 + Math.random() * 18,
          vy: 6 + Math.random() * 10,
          alpha: 0.15 + Math.random() * 0.35
        }));
        footprints = [];
      }

      // =======================================================================
      // 7. DILEMMA RESOLUTION & ASCENT TRIGGER
      // =======================================================================
      function resolveDilemmaChoice(siteId, choiceId) {
        const site = LANDMARKS.find(l => l.id === siteId);
        if (!site) return;
        const stageIdx = state.siteStage[siteId] || 0;
        const dilemma = site.dilemmas[stageIdx];
        if (!dilemma) return;
        const ch = dilemma.choices.find(c => c.id === choiceId);
        if (!ch) return;

        const role = ROLES[state.role];

        // Apply Role-Modified Deltas
        let hullDelta = ch.hullDelta > 0 ? Math.round(ch.hullDelta * role.repairMult) : ch.hullDelta;
        let o2Delta = ch.o2Delta < 0 ? Math.round(ch.o2Delta * role.o2BurnMult) : ch.o2Delta;
        let sciDelta = ch.scienceDelta > 0 ? Math.round(ch.scienceDelta * state.scienceMultRuntime) : ch.scienceDelta;

        if (ch.powerDelta < 0 && state.power < Math.abs(ch.powerDelta)) {
          AudioFX.alert();
          state.advisorMessages.push({
            sender: 'HERMES-9',
            text: `INSUFFICIENT POWER: Action requires ${Math.abs(ch.powerDelta)} kWh (only ${Math.round(state.power)} kWh available).`
          });
          renderHUD();
          return;
        }

        state.hull = Math.max(5, Math.min(100, state.hull + hullDelta));
        state.o2 = Math.max(0, Math.min(100, state.o2 + o2Delta));
        state.power = Math.max(0, Math.min(state.maxPower, state.power + ch.powerDelta));
        state.scienceScore = Math.max(0, state.scienceScore + sciDelta);
        state.dataUsed = Math.max(0, Math.min(state.dataMax, state.dataUsed + ch.dataDelta));
        if (ch.sciencePenalty) {
          state.scienceMultRuntime = Math.max(0.5, state.scienceMultRuntime - ch.sciencePenalty);
        }
        if (ch.commsSet) {
          state.comms = ch.commsSet;
        }

        state.siteStage[siteId] = stageIdx + 1;
        state.openDilemmaSiteId = null;
        state.missionLogs.unshift(`[${site.code}] ${ch.log}`);

        if (hullDelta < 0 || o2Delta <= -18) AudioFX.alert();
        else AudioFX.radarPing();

        if (state.o2 <= 0) {
          triggerDebrief(false, 'EVA OXYGEN DEPLETED ON TITAN SURFACE');
          return;
        }

        renderHUD();
      }

      function attemptAscentLaunch() {
        if (state.hull < 80) {
          AudioFX.alert();
          return;
        }
        AudioFX.crashImpact();
        // If hull is between 80% and 99%, small aerodynamic failure risk during ascent
        if (state.hull < 100) {
          const survivalChance = 0.45 + ((state.hull - 80) / 20) * 0.5;
          if (Math.random() > survivalChance) {
            triggerDebrief(false, `AEROSHELL BREACH DURING ASCENT AT ${state.hull}% HULL INTEGRITY`);
            return;
          }
        }
        triggerDebrief(true, 'ORBITAL INSERTION CONFIRMED // TITAN ASCENT SUCCESSFUL');
      }

      function triggerDebrief(survived, headline) {
        stopSurfaceLoop();
        state.phase = 'debrief';

        const hullPts = survived ? Math.round((state.hull / 100) * 35) : 0;
        const sciPts = Math.min(40, Math.round((state.scienceScore / 420) * 40));
        const commsBonus = state.comms === 'ONLINE' ? 10 : 0;
        const marginPts = survived ? Math.min(15, Math.round((state.o2 / 100) * 10 + (state.power / state.maxPower) * 5)) : 0;
        const total = Math.min(100, hullPts + sciPts + commsBonus + marginPts);

        let grade = 'MISSION FAILURE';
        let color = 'text-rose-400';
        if (survived && total >= 82) { grade = 'HISTORIC NASA EXPEDITION'; color = 'text-cyan-400'; }
        else if (survived && total >= 60) { grade = 'MISSION SUCCESS'; color = 'text-emerald-400'; }
        else if (survived) { grade = 'SURVIVAL // LOW DATA YIELD'; color = 'text-amber-400'; }

        state.debriefOutcome = { survived, headline, total, hullPts, sciPts, commsBonus, marginPts, grade, color };
        render();

        if (typeof mergeConfig.onComplete === 'function') {
          mergeConfig.onComplete(state.debriefOutcome);
        }
      }

      // =======================================================================
      // 8. 2.5D PLAYABLE TITAN SURFACE ENGINE (CANVAS RENDER & MOVEMENT)
      // =======================================================================
      function startSurfaceLoop() {
        stopSurfaceLoop();
        lastTs = performance.now();

        const onKeyDown = (e) => {
          state.keys[e.key.toLowerCase()] = true;
          if ((e.key === 'e' || e.key === 'E' || e.key === ' ') && state.phase === 'surface' && !state.openDilemmaSiteId) {
            if (state.activeLandmarkId) {
              AudioFX.click();
              state.openDilemmaSiteId = state.activeLandmarkId;
              renderHUD();
            }
          }
          if (state.phase === 'surface' && !state.openDilemmaSiteId) {
            if (e.key === '1') useInventoryItem('heatPack');
            if (e.key === '2') useInventoryItem('battery');
            if (e.key === '3') useInventoryItem('nanites');
            if (e.key === '4') useInventoryItem('drill');
          }
          if (e.key === 'Escape' && state.openDilemmaSiteId) {
            state.openDilemmaSiteId = null;
            renderHUD();
          }
        };
        const onKeyUp = (e) => { state.keys[e.key.toLowerCase()] = false; };

        window._titanKeyDown = onKeyDown;
        window._titanKeyUp = onKeyUp;
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        function tick(now) {
          const dt = Math.min(0.05, (now - lastTs) / 1000);
          lastTs = now;
          updateSurface(dt);
          drawSurface();
          rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);
      }

      function stopSurfaceLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        if (window._titanKeyDown) window.removeEventListener('keydown', window._titanKeyDown);
        if (window._titanKeyUp) window.removeEventListener('keyup', window._titanKeyUp);
      }

      function handleCanvasClick(e) {
        if (state.phase !== 'surface' || state.openDilemmaSiteId) return;
        AudioFX.ensure();
        const canvas = document.getElementById('titan-surface-canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickScreenX = e.clientX - rect.left;
        const clickScreenY = e.clientY - rect.top;

        const worldX = state.cam.x - rect.width / 2 + clickScreenX;
        const worldY = state.cam.y - rect.height / 2 + clickScreenY;

        // Check if player clicked directly on a nearby landmark
        const clickedSite = LANDMARKS.find(l => Math.hypot(l.x - worldX, l.y - worldY) <= l.radius + 25);
        if (clickedSite && Math.hypot(clickedSite.x - state.player.x, clickedSite.y - state.player.y) <= clickedSite.radius + 45) {
          AudioFX.click();
          state.openDilemmaSiteId = clickedSite.id;
          renderHUD();
          return;
        }

        // Otherwise set click-to-walk waypoint
        state.player.targetX = Math.max(140, Math.min(1660, worldX));
        state.player.targetY = Math.max(160, Math.min(1020, worldY));
        AudioFX.click();
      }

      function updateSurface(dt) {
        if (state.phase !== 'surface') return;

        // Update atmospheric hydrocarbon particles
        particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x > 1800) p.x = 0;
          if (p.y > 1150) p.y = 0;
        });

        // Thermal Core & Cryogenic Hazard Simulation (-179°C)
        if (state.heatPackTimer > 0) {
          state.heatPackTimer = Math.max(0, state.heatPackTimer - dt);
          state.thermalCore = Math.min(100, state.thermalCore + 25 * dt);
        } else {
          const isNearLander = Math.hypot(520 - state.player.x, 620 - state.player.y) <= 120;
          if (isNearLander) {
            state.thermalCore = Math.min(100, state.thermalCore + 15 * dt);
          } else {
            state.thermalCore = Math.max(12, state.thermalCore - 0.7 * dt);
          }
        }

        // Pause movement while dilemma modal is open
        if (state.openDilemmaSiteId) return;

        let dx = 0;
        let dy = 0;
        if (state.keys['w'] || state.keys['arrowup']) dy -= 1;
        if (state.keys['s'] || state.keys['arrowdown']) dy += 1;
        if (state.keys['a'] || state.keys['arrowleft']) dx -= 1;
        if (state.keys['d'] || state.keys['arrowright']) dx += 1;

        if (dx !== 0 || dy !== 0) {
          state.player.targetX = null;
          state.player.targetY = null;
        } else if (state.player.targetX !== null && state.player.targetY !== null) {
          const tx = state.player.targetX - state.player.x;
          const ty = state.player.targetY - state.player.y;
          const dist = Math.hypot(tx, ty);
          if (dist > 8) {
            dx = tx / dist;
            dy = ty / dist;
          } else {
            state.player.targetX = null;
            state.player.targetY = null;
          }
        }

        const mag = Math.hypot(dx, dy);
        if (mag > 0) {
          const speed = 185; // Low-gravity Titan EVA stride
          const nx = dx / mag;
          const ny = dy / mag;
          state.player.x = Math.max(140, Math.min(1660, state.player.x + nx * speed * dt));
          state.player.y = Math.max(160, Math.min(1020, state.player.y + ny * speed * dt));
          state.player.facing = Math.atan2(ny, nx);
          state.player.walkCycle += dt * 10;
          state.player.stepTimer += dt;

          // EVA O2 burn: increases significantly if suit is freezing (< 35% thermal)
          let burnRate = 0.42 * ROLES[state.role].o2BurnMult;
          if (state.thermalCore < 35) burnRate *= 1.75; // Shivering hypothermia metabolic drain
          state.o2 = Math.max(0, state.o2 - burnRate * dt);
          if (state.o2 <= 0) {
            triggerDebrief(false, 'EVA OXYGEN DEPLETED DURING SURFACE TRAVERSE');
            return;
          }

          if (state.player.stepTimer >= 0.36) {
            state.player.stepTimer = 0;
            AudioFX.footstep();
            footprints.push({ x: state.player.x, y: state.player.y + 12, alpha: 0.55 });
            if (footprints.length > 45) footprints.shift();
          }
        }

        // Smooth camera follow
        state.cam.x += (state.player.x - state.cam.x) * Math.min(1, dt * 6.5);
        state.cam.y += (state.player.y - state.cam.y) * Math.min(1, dt * 6.5);

        // Proximity detection to 4 Landmarks
        let nearest = null;
        for (const site of LANDMARKS) {
          const d = Math.hypot(site.x - state.player.x, site.y - state.player.y);
          if (d <= site.radius + 35) {
            nearest = site.id;
            break;
          }
        }
        if (nearest !== state.activeLandmarkId) {
          state.activeLandmarkId = nearest;
          if (nearest) AudioFX.radarPing();
          renderHUD();
        } else if (mag > 0) {
          // Lightweight O2 readout update during movement
          const o2El = document.getElementById('hud-o2-val');
          const o2Bar = document.getElementById('hud-o2-bar');
          if (o2El) o2El.textContent = `${Math.ceil(state.o2)}%`;
          if (o2Bar) o2Bar.style.width = `${Math.max(0, state.o2)}%`;
        }
      }

      function drawSurface() {
        const canvas = document.getElementById('titan-surface-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cw = (canvas.width = canvas.clientWidth);
        const ch = (canvas.height = canvas.clientHeight);

        const ox = cw / 2 - state.cam.x;
        const oy = ch / 2 - state.cam.y;

        // 1. Deep Amber-Brown Tholin Ground Base
        ctx.fillStyle = '#140c06';
        ctx.fillRect(0, 0, cw, ch);

        // 2. Distant Horizon Sky & Giant Ringed Saturn (Parallax)
        const skyH = Math.max(0, 210 + oy * 0.45);
        if (skyH > 0) {
          const skyGrad = ctx.createLinearGradient(0, 0, 0, skyH);
          skyGrad.addColorStop(0, '#090604');
          skyGrad.addColorStop(0.55, '#451a03');
          skyGrad.addColorStop(1, '#b45309');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, cw, skyH);

          // Giant Ringed Saturn
          const sx = cw * 0.72 - (state.cam.x - 900) * 0.08;
          const sy = skyH * 0.48;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = 'rgba(253, 230, 138, 0.55)';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.ellipse(0, 0, 110, 22, -0.28, Math.PI, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(0, 0, 42, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(0, 0, 110, 22, -0.28, 0, Math.PI);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(ox, oy);

        // 3. Topographic Telemetry Grid & Tholin Dunes
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.07)';
        ctx.lineWidth = 1;
        for (let gx = 0; gx <= 1800; gx += 120) {
          ctx.beginPath(); ctx.moveTo(gx, 140); ctx.lineTo(gx, 1060); ctx.stroke();
        }
        for (let gy = 140; gy <= 1060; gy += 120) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(1800, gy); ctx.stroke();
        }

        // Tholin Sand Dunes
        ctx.fillStyle = '#1f1208';
        ctx.beginPath();
        ctx.ellipse(420, 440, 260, 75, 0.1, 0, Math.PI * 2);
        ctx.ellipse(1060, 860, 310, 85, -0.08, 0, Math.PI * 2);
        ctx.fill();

        // 4. Kraken Mare Liquid Methane Sea (Bottom-Right Region)
        const seaGrad = ctx.createRadialGradient(1480, 840, 40, 1480, 840, 430);
        seaGrad.addColorStop(0, '#083344');
        seaGrad.addColorStop(0.65, '#0c4a6e');
        seaGrad.addColorStop(1, '#140c06');
        ctx.fillStyle = seaGrad;
        ctx.beginPath();
        ctx.ellipse(1490, 830, 360, 240, -0.18, 0, Math.PI * 2);
        ctx.fill();

        // Shoreline Foam Ring
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(1490, 830, 330, 215, -0.18, 0, Math.PI * 2);
        ctx.stroke();

        // 5. Crash Skid Trench Behind Lander
        ctx.strokeStyle = 'rgba(10, 6, 3, 0.85)';
        ctx.lineWidth = 34;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(190, 490);
        ctx.lineTo(510, 620);
        ctx.stroke();

        // 6. Footprints in Tholin Dust
        footprints.forEach(fp => {
          fp.alpha *= 0.996;
          ctx.fillStyle = `rgba(0, 0, 0, ${fp.alpha})`;
          ctx.beginPath();
          ctx.ellipse(fp.x, fp.y, 5, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // 7. Click-to-Walk Waypoint Marker
        if (state.player.targetX !== null) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(state.player.targetX, state.player.targetY, 12 + Math.sin(performance.now() * 0.01) * 3, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 8. Draw 4 Interactive Landmarks
        LANDMARKS.forEach(site => {
          const isNear = state.activeLandmarkId === site.id;
          const doneCount = state.siteStage[site.id] || 0;
          const totalStages = site.dilemmas.length;

          // Proximity Radar Ring
          ctx.strokeStyle = isNear ? site.color : 'rgba(255,255,255,0.14)';
          ctx.lineWidth = isNear ? 2.5 : 1.2;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.arc(site.x, site.y, site.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);

          // Custom Landmark Artwork
          if (site.id === 'lander') {
            // Crashed Titan Lander
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(site.x - 42, site.y + 22);
            ctx.lineTo(site.x - 24, site.y - 26);
            ctx.lineTo(site.x + 24, site.y - 26);
            ctx.lineTo(site.x + 42, site.y + 22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Lander Legs
            ctx.beginPath();
            ctx.moveTo(site.x - 36, site.y + 12); ctx.lineTo(site.x - 56, site.y + 34);
            ctx.moveTo(site.x + 36, site.y + 12); ctx.lineTo(site.x + 56, site.y + 34);
            ctx.stroke();
          } else if (site.id === 'comms') {
            // High-Gain Parabolic Dish
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(site.x, site.y + 26);
            ctx.lineTo(site.x, site.y - 8);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(site.x, site.y - 16, 26, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();
          } else if (site.id === 'lake') {
            // Methane Sampling Buoy / Shoreline Marker
            ctx.fillStyle = '#083344';
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(site.x, site.y, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (site.id === 'vent') {
            // Cryovolcanic Fissure Glow
            const glow = ctx.createRadialGradient(site.x, site.y, 4, site.x, site.y, 44);
            glow.addColorStop(0, 'rgba(52, 211, 153, 0.85)');
            glow.addColorStop(1, 'rgba(52, 211, 153, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(site.x, site.y, 44, 0, Math.PI * 2);
            ctx.fill();
          }

          // Floating Site Beacon Label
          ctx.font = '600 11px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = isNear ? '#ffffff' : '#cbd5e1';
          ctx.fillText(`${site.code} // ${site.name}`, site.x, site.y - site.radius - 10);

          ctx.font = '500 10px "JetBrains Mono", monospace';
          ctx.fillStyle = doneCount >= totalStages ? '#34d399' : site.color;
          ctx.fillText(
            doneCount >= totalStages ? '✓ SITE COMPLETE' : isNear ? '[E] OR CLICK TO INSPECT' : `TASKS: ${doneCount}/${totalStages}`,
            site.x,
            site.y - site.radius + 4
          );
        });

        // 9. Draw Astronaut EVA Character + Headlamp Cone
        const px = state.player.x;
        const py = state.player.y;
        const bob = Math.sin(state.player.walkCycle) * 2.5;

        // Headlamp Volumetric Cone
        ctx.save();
        ctx.translate(px, py - 8);
        ctx.rotate(state.player.facing);
        const cone = ctx.createRadialGradient(0, 0, 8, 90, 0, 145);
        cone.addColorStop(0, 'rgba(254, 243, 199, 0.34)');
        cone.addColorStop(1, 'rgba(254, 243, 199, 0)');
        ctx.fillStyle = cone;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 145, -0.38, 0.38);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Ground Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.ellipse(px, py + 15, 13, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // EVA PLSS Backpack
        ctx.fillStyle = '#334155';
        ctx.fillRect(px - 10, py - 14 + bob, 20, 18);

        // Spacesuit Torso
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(px - 8, py - 12 + bob, 16, 18, 5);
        ctx.fill();

        // Gold Reflective Astronaut Helmet
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.arc(px, py - 18 + bob, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(px + Math.cos(state.player.facing) * 2.5, py - 18 + bob, 6.2, 0, Math.PI * 2);
        ctx.fill();

        // 10. Drifting Hydrocarbon Mist Particles
        particles.forEach(p => {
          ctx.fillStyle = `rgba(251, 191, 36, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

                  `).join('')}
                </div>
                <div class="flex flex-wrap gap-1">
                  <button onclick="TitanMissionModule.quickAsk('Analyze Hull vs O2 risk')" class="px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 border border-slate-700 text-[10px] text-cyan-200 cursor-pointer">Hull vs O₂</button>
                  <button onclick="TitanMissionModule.quickAsk('Prioritize Comms or Lake?')" class="px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 border border-slate-700 text-[10px] text-cyan-200 cursor-pointer">Comms vs Lake</button>
                  <button onclick="TitanMissionModule.quickAsk('Assess ascent readiness')" class="px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 border border-slate-700 text-[10px] text-cyan-200 cursor-pointer">Ascent Check</button>
                </div>
                <form onsubmit="TitanMissionModule.submitAsk(event)" class="flex gap-1.5">
                  <input id="hermes-input" type="text" placeholder="Ask telemetry trade-off..."
                    class="flex-1 bg-slate-950/90 border border-slate-700 rounded-lg px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-400" />
                  <button type="submit" class="px-2.5 py-1.5 rounded-lg bg-cyan-400 text-slate-950 font-bold text-[11px] cursor-pointer">ASK</button>
                </form>
              </div>
            ` : ''}
          </div>

          <!-- BOTTOM BAR: MOVEMENT HINT & PROXIMITY ACTION BUTTON -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="pointer-events-auto jpl-panel rounded-xl px-3.5 py-2 font-mono text-[11px] text-slate-300">
              <span class="text-amber-400 font-bold">EVA CONTROLS:</span> WASD / Arrows or Click Terrain to Walk • Press <span class="text-cyan-300 font-bold">[E]</span> at Sites
            </div>
            ${nearSite && !modalDilemma ? `
              <button onclick="TitanMissionModule.openSite('${nearSite.id}')"
                class="pointer-events-auto px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-mono font-bold text-xs shadow-[0_0_20px_rgba(245,158,11,0.5)] cursor-pointer">
                [E] INSPECT ${nearSite.name}
              </button>
            ` : ''}
          </div>

          <!-- CENTER HIGH-STAKE DILEMMA MODAL (NO RIGHT ANSWER) -->
          ${modalSite && modalDilemma ? `
            <div class="pointer-events-auto fixed inset-0 bg-black/65 flex items-center justify-center p-4 z-40">
              <div class="jpl-panel rounded-3xl max-w-xl w-full p-6 space-y-4 border-2 border-amber-400/60">
                <div class="flex items-center justify-between">
                  <span class="font-mono text-xs text-amber-400">${modalSite.code} // ${modalSite.tag}</span>
                  <button onclick="TitanMissionModule.closeModal()" class="font-mono text-xs text-slate-400 hover:text-white cursor-pointer">[ESC] CLOSE</button>
                </div>
                <div>
                  <h3 class="text-xl font-bold text-white">${modalDilemma.title}</h3>
                  <div class="font-mono text-[11px] text-cyan-300 mt-1">${modalDilemma.telemetry}</div>
                </div>
                <div class="space-y-3">
                  ${modalDilemma.choices.map(c => `
                    <button onclick="TitanMissionModule.choose('${modalSite.id}', '${c.id}')"
                      class="w-full text-left p-4 rounded-2xl bg-slate-950/90 hover:bg-slate-900 border border-slate-700 hover:border-amber-400 transition-all cursor-pointer">
                      <div class="font-bold text-white text-sm">${c.label}</div>
                      <div class="font-mono text-xs text-amber-300 mt-1">${c.costText}</div>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : modalSite && !modalDilemma ? `
            <div class="pointer-events-auto fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-40">
              <div class="jpl-panel rounded-2xl max-w-md w-full p-5 text-center space-y-3">
                <div class="font-mono text-xs text-emerald-400">${modalSite.code} // ALL SITE PROTOCOLS EXECUTED</div>
                <h3 class="text-lg font-bold text-white">${modalSite.name}</h3>
                <p class="text-xs text-slate-300">No further telemetry or repair operations remain at this sector.</p>
                <button onclick="TitanMissionModule.closeModal()" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-mono font-bold text-xs cursor-pointer">CONTINUE EVA</button>
              </div>
            </div>
          ` : ''}
        `;
      }

      // =======================================================================
      // 11. PUBLIC MODULE API (TEAM MERGE READY)
      // =======================================================================
      function init(opts = {}) {
        mergeConfig = { ...mergeConfig, ...opts };
        state.phase = 'briefing';
        render();
      }

      function destroy() {
        stopSurfaceLoop();
        if (!AudioFX.muted) AudioFX.toggleMute();
      }

      async function claimExpeditionReward() {
        AudioFX.click();
        const btn = document.getElementById('btn-claim-reward');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'TRANSMITTING TELEMETRY...';
        }
        const payload = {
          mission_id: 'TITAN-SURFACE-EVA',
          mission_name: 'Titan: Last Transmission Surface Expedition',
          score: state.debriefOutcome ? state.debriefOutcome.total : 85,
          science_score: Math.round(state.scienceScore),
          survived: state.debriefOutcome ? state.debriefOutcome.survived : true,
          data_transmitted_gb: state.dataUsed,
          grade: state.debriefOutcome ? state.debriefOutcome.grade : 'MISSION SUCCESS',
          details: `Samples: ${state.inventory.samples.join(', ') || 'None'}. Final Hull: ${state.hull}%.`
        };
        try {
          const res = await fetch('/api/v1/agency/expedition/reward', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            state.claimedReward = data;
            AudioFX.radarPing();
            render();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'TITAN_EXPEDITION_COMPLETE', reward: data }, '*');
            }
          } else {
            if (btn) btn.textContent = 'TRANSMISSION ERROR';
          }
        } catch (err) {
          console.error('Failed to claim reward:', err);
          if (btn) btn.textContent = 'OFFLINE - RETRY';
        }
      }

      return {
        init,
        destroy,
        reset: () => { AudioFX.click(); state.phase = 'briefing'; render(); },
        returnToHub: () => { AudioFX.click(); if (mergeConfig.onReturnToHub) mergeConfig.onReturnToHub(); },
        toggleAudioBtn: () => { AudioFX.toggleMute(); render(); if (state.phase === 'surface') drawSurface(); },
        setRole: (r) => { AudioFX.click(); state.role = r; render(); },
        setHullAlloc: (val) => { state.hullAlloc = parseInt(val, 10); render(); },
        toggleRTG: (val) => { AudioFX.click(); state.extraRTG = val; render(); },
        launchMission: startMissionFromBriefing,
        canvasClick: handleCanvasClick,
        openSite: (id) => { AudioFX.click(); state.openDilemmaSiteId = id; renderHUD(); },
        closeModal: () => { AudioFX.click(); state.openDilemmaSiteId = null; renderHUD(); },
        choose: resolveDilemmaChoice,
        useItem: useInventoryItem,
        claimExpeditionReward,
        attemptAscent: attemptAscentLaunch,
        toggleAdvisor: () => { AudioFX.click(); state.advisorOpen = !state.advisorOpen; renderHUD(); },
        quickAsk: (q) => askHermes(q),
        submitAsk: (e) => {
          e.preventDefault();
          const inp = document.getElementById('hermes-input');
          if (inp && inp.value.trim()) {
            const val = inp.value;
            inp.value = '';
            askHermes(val);
          }
        }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      window.TitanMissionModule.init({ containerId: 'titan-game-root' });
    });
  </script>
</body>
</html>
